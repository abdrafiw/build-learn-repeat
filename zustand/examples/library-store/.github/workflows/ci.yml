name: CI Workflow

on:
  push:
     branches: [main]
  pull_request:
     branches: [main]

jobs: 
    lint:
       runs-on: ubuntu-latest 
       steps:
         - name: checkout
           uses: actions/checkout@v6

         - name: setup nodejs
           uses: actions/setup-node@v6

           with:
             node-version: 22
             cache: "npm"

         - name: install dep
           run: npm ci

         - name: run linter
           run: npm run lint

    test:
       runs-on: ubuntu-latest 
       steps:
         - name: checkout
           uses: actions/checkout@v6

         - name: setup nodejs
           uses: actions/setup-node@v6

           with:
             node-version: 22
             cache: "npm"

         - name: install dep
           run: npm ci

         - name: run test
           run: npm run test

    build:
       runs-on: ubuntu-latest 
       steps:
         - name: checkout
           uses: actions/checkout@v6

         - name: setup nodejs
           uses: actions/setup-node@v6

           with:
             node-version: 22
             cache: "npm"

         - name: install dep
           run: npm ci

         - name: run linter
           run: npm run build

      

           