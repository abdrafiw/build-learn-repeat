#   Important details:

#   - working-directory tells every run command to execute inside the nested project.
#   - cache-dependency-path tells setup-node where the nested package-lock.json is.
#   - paths prevents this workflow from running when unrelated projects change.
#   - The local absolute path /Users/rafiw/... must not appear in the workflow; GitHub uses paths relative to the repository root. GitHub
#     documents this through its defaults.run.working-directory setting.  
  
  name: Library Store CI

  on:
    push:
      branches: [main]
      paths:
        - "zustand/examples/library-store/**"
        - ".github/workflows/library-store-ci.yml"

    pull_request:
      branches: [main]
      paths:
        - "zustand/examples/library-store/**"
        - ".github/workflows/library-store-ci.yml"

  permissions:
    contents: read

  defaults:
    run:
      working-directory: zustand/examples/library-store

  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: install dep
        run: npm ci

      - name: run linter
        run: npm run lint

    test:
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: install dep
        run: npm ci

      - name: run linter
        run: npm run test


    build:
       needs: ['lint' , 'test']
       runs-on: ubuntu-latest

       steps:
         - name: Checkout repository
           uses: actions/checkout@v6

         - name: Set up Node.js
           uses: actions/setup-node@v6
           with:
             node-version: 22
             cache: npm
             cache-dependency-path: zustand/examples/library-store/package-lock.json

         - name: Install dependencies
           run: npm ci

         - name: Build
           run: npm run build        